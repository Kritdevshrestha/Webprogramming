<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Afnan Perfumes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="checkout-card p-4">
          <h2 class="text-center mb-4">Checkout</h2>
          
          <form action="order-confirmation.html" method="post">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="fullname" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10,15}" required>
              <div class="form-text">Enter digits only</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Shipping Address</label>
              <textarea class="form-control" name="address" rows="3" placeholder="Enter your address" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" name="payment" required>
                <option value="cod">Cash on Delivery</option>
                <option value="card">Credit/Debit Card</option>
                <option value="esewa">Esewa</option>
              </select>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="cart.html" class="btn btn-outline-secondary">← Go Back to Cart</a>
              <button type="submit" class="btn btn-success">Place Order</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
