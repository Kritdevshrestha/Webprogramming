<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Afnan Perfumes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100" style="background: url('images/image.png') no-repeat center center/cover; height:100vh;">


    <div class="container justify-content-center align-items-center flex-grow-1 d-flex">
      <div class="card login-card shadow-lg p-4" style="max-width: 500px; width: 100%;">
        <h3 class="text-center mb-4">Login</h3>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="tel" id="phoneNumber" class="form-control" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-purple w-100">Login</button>
        </form>

        <!-- Signup link -->
        <p class="text-center mt-3">
          Don’t have an account? 
          <a href="signup.html" class="text-purple fw-semibold">Sign Up</a>
        </p>
      </div>
    </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault(); // Stop form from submitting normally

      const name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phoneNumber").value.trim();

      // Name validation
      if (name.length < 2) {
        alert("Please enter your full name.");
        return;
      }

      // Phone number validation (digits only, 7-15 digits)
      const phoneRegex = /^[0-9]{7,15}$/;
      if (!phoneRegex.test(phone)) {
        alert("Please enter a valid phone number (7-15 digits).");
        return;
      }

      // Save to localStorage (optional - for keeping logged in)
      localStorage.setItem("username", name);
      localStorage.setItem("phone", phone);

      alert("Login successful! Redirecting...");
      window.location.href = "index.html"; // Redirect to homepage
    });
  </script>
</body>
</html>
