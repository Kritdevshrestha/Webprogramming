<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Afnan Perfumes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="custom-header">
      <img src="afnanlogo.png" alt="Afnan Perfumes Logo" class="logo" />
      <h1 class="brand-title">Afnan Perfumes</h1>

      <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid justify-content-center">
          <button class="navbar-toggler mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                  aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav gap-4">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
              <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Contact Form -->
    <main class="flex-grow-1 d-flex flex-column justify-content-center align-items-center my-5 px-3">
      <div class="contact-form" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-4" style="color: #a564c6;">Get in Touch</h2>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Name<span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="name" placeholder="Your full name" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address<span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message<span class="text-danger">*</span></label>
            <textarea class="form-control" id="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-purple w-100">Send Message</button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Krit's Perfume Collection. All rights reserved.</p>
      <p>Contact us at: <a href="mailto:info@afnanperfumes.com">info@afnanperfumes.com</a></p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
